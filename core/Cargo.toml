[package]
name = "eu5-population-core"
version = "1.0.2"
edition = "2021"
rust-version = "1.85"
authors = ["davoda1"]
publish = false
homepage = "https://github.com/Davoda1/EU5-Population-Editor"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "=1.0.100"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
walkdir = "=2.5.0"
image = { version = "=0.25.6", default-features = false, features = ["png"] }
base64 = "=0.22.1"
tempfile = "=3.23.0"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
