name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the tag against master and application metadata
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'A semantic version tag is required.'; exit 1; }
          commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/master
          git checkout --detach "$commit"
          expected="v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          test "$RELEASE_TAG" = "$expected"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}
  publish:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: eu5-release-bundle
          path: release
      - name: Create a draft release with verified, complete assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          node scripts/check-release-set.mjs
          (cd release && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "EU5 Population Editor $RELEASE_TAG" --notes-file CHANGELOG.md
